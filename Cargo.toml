[package]
name = "tpo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Virtual network topologies from Linux namespaces and tc, changeable live"
license = "MIT OR Apache-2.0"
keywords = ["network", "netns", "tc", "netem", "testing"]
categories = ["command-line-utilities", "development-tools::testing", "network-programming"]
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
nix = { version = "0.31.3", features = ["sched", "mount", "process", "signal", "hostname", "fs", "socket", "uio", "poll", "user", "term"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = { version = "1.1.6", features = ["preserve_order"] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
